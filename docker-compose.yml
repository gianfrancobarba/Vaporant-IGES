version: '3.8'

services:
  db:
    image: mysql:8.0
    command: --lower_case_table_names=1
    container_name: vaporant-db
    restart: unless-stopped
    environment:
      # La password arriva dal file .env (vedi .env.example); nessun segreto in chiaro nel compose.
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Monta lo script SQL per creare automaticamente il database e inserire i seed
      - ./db/storage.sql:/docker-entrypoint-initdb.d/01-storage.sql:ro
      # Volume persistente per conservare i dati tra i riavvii del container
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: vaporant-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Passiamo le credenziali tramite variabili d'ambiente (saranno lette dal nostro context.xml parametrizzato)
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: storage
      DB_USER: root
      # Stessa password del servizio db, presa dal file .env (nessun segreto in chiaro).
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        # L'app si avvia solo quando il database è "healthy" (pronto a ricevere connessioni)
        condition: service_healthy
    healthcheck:
      # Probe HTTP sul context root: serve la welcome-file ProductView.jsp (catalogo, accessibile ospite).
      # start_period assorbe il tempo di avvio di Tomcat e di deploy della WAR.
      test: ["CMD-SHELL", "curl -f http://localhost:8080/Vaporant_IGES_war_exploded/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  mysql-data:
